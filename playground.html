<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Font Playground | Font Studio</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/studio.css"></head><body><header class="topbar"><a class="brand" href="index.html"><b>F</b><span>Font Studio</span></a><nav><a href="mypage.html">マイフォント<small>MY FONTS</small></a><a class="active" href="playground.html">プレイグラウンド<small>PLAYGROUND</small></a></nav></header><main class="page"><p class="eyebrow">フォントを試す<span>FONT PLAYGROUND</span></p><h1>Font Playground</h1><p>制作中のフォントを大きな文字で確認します。</p><div class="settings-grid"><label>文字サイズ<input id="size" type="range" min="12" max="240" value="96"></label><label>字間<input id="tracking" type="range" min="-20" max="80" value="0"></label><label>行間<input id="leading" type="range" min="70" max="200" value="120"></label></div><textarea id="text">Typography is the art of arranging type.
ABCDEFGHIJKLMNOPQRSTUVWXYZ
abcdefghijklmnopqrstuvwxyz
0123456789</textarea><div id="stage" class="live-preview" contenteditable="true">Typography is the art of arranging type.
ABCDEFGHIJKLMNOPQRSTUVWXYZ
abcdefghijklmnopqrstuvwxyz
0123456789</div></main><script src="js/app.js"></script><script>const q=s=>document.querySelector(s);function u(){q('stage').style.fontSize=q('size').value+'px';q('stage').style.letterSpacing=q('tracking').value+'px';q('stage').style.lineHeight=(q('leading').value/100);q('stage').textContent=q('text').value}['size','tracking','leading','text'].forEach(x=>q(x).addEventListener('input',u));u();</script></body></html>
