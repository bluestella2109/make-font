<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Export | Font Studio</title><link rel="stylesheet" href="css/style.css"></head><body><header class="topbar"><a class="brand" href="editor.html"><b>F</b><span>Font Studio</span></a><nav><a href="mypage.html">マイフォント</a><a class="active" href="export.html">書き出し</a></nav></header><main class="page narrow"><p class="eyebrow">ビルドと書き出し<span>BUILD & EXPORT</span></p><h1>フォントを書き出す<span class="en-label">EXPORT FONT</span></h1><p>生成前にプロジェクトを検査します。<span class="en-sub">Check your project before building.</span></p><div id="checks" class="checklist"></div><div class="export-note">TTFとWOFFはブラウザ内で生成。WOFF2は対応エンコーダーを利用できる環境で生成します。<br><a href="playground.html">Font Playgroundを開く →</a></div><div class="export-grid big"><button class="export-card featured" onclick="exportTTF()"><b>TTF</b><span>TrueTypeフォント</span></button><button class="export-card" onclick="exportWOFF()"><b>WOFF</b><span>Web Open Font Format</span></button><button class="export-card" onclick="exportWOFF2()"><b>WOFF2</b><span>WOFF2フォント</span></button><button class="export-card" onclick="exportJSON()"><b>JSON</b><span>プロジェクトのバックアップ</span></button><button class="export-card" onclick="exportSVG()"><b>SVG</b><span>文字の輪郭</span></button><button class="export-card" onclick="exportCSS()"><b>CSS</b><span>Webフォント用CSS</span></button></div><div id="exportMessage" class="notice"></div></main><script src="js/app.js"></script><script src="js/ttf.js"></script></body></html>
