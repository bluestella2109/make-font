<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editor | Font Studio</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/editor.css"></head>
<body class="editor-body"><header class="editor-top"><a class="brand" href="mypage.html"><span class="brand-mark">F</span><span id="fontName">My Font</span></a><div class="save-status" id="saveStatus">保存済み</div><div class="top-actions"><button onclick="undo()">Undo</button><button onclick="redo()">Redo</button><button onclick="saveProject()">保存</button><a class="primary mini" href="export.html">書き出し</a></div></header>
<div class="app-shell"><aside class="sidebar"><button class="side-tab active" data-tab="editor">Editor</button><button class="side-tab" data-tab="glyphs">Glyphs</button><button class="side-tab" data-tab="spacing">Spacing</button><button class="side-tab" data-tab="preview">Preview</button><button class="side-tab" data-tab="fontinfo">Font Info</button><button class="side-tab" data-tab="export">Export</button><div class="sidebar-tools"><button title="選択">Select</button><button title="ペン">Pen</button><button title="ノード">Node</button><button title="長方形">Rect</button><button title="楕円">Ellipse</button><button title="ガイド">Guide</button><button title="測定">Measure</button></div></aside>
<main class="workspace"><div id="panel-editor" class="panel active"><div class="panelbar"><strong>Glyph Editor</strong><select id="glyphSelect"></select><div class="panel-controls"><button onclick="zoom(-1)">−</button><span id="zoomLabel">100%</span><button onclick="zoom(1)">＋</button><button onclick="toggleGrid()">Grid</button><button onclick="toggleFullscreen()">Fullscreen</button></div></div><div class="canvas-wrap"><canvas id="glyphCanvas"></canvas><div class="coords" id="coords">X: 0　Y: 0</div></div></div>
<div id="panel-glyphs" class="panel"><div class="panelbar"><strong>Glyphs</strong><input id="glyphSearch" placeholder="文字を検索"></div><div id="glyphGrid" class="glyph-grid"></div></div>
<div id="panel-spacing" class="panel"><div class="panelbar"><strong>Spacing & Kerning</strong></div><div class="settings-grid"><label>Advance Width<input id="advance" type="number"></label><label>Left Side Bearing<input id="lsb" type="number"></label><label>Right Side Bearing<input id="rsb" type="number"></label><label>Kerning<input id="kern" type="number" value="0"></label></div></div>
<div id="panel-preview" class="panel"><div class="panelbar"><strong>Preview</strong></div><textarea id="previewText">ABCDEFGHIJKLMNOPQRSTUVWXYZ
abcdefghijklmnopqrstuvwxyz
0123456789</textarea><div id="livePreview" class="live-preview"></div></div>
<div id="panel-fontinfo" class="panel"><div class="panelbar"><strong>Font Info</strong></div><div class="settings-grid"><label>Font Name<input id="infoName"></label><label>Family<input id="infoFamily"></label><label>Style<select id="infoStyle"><option>Regular</option><option>Bold</option><option>Italic</option><option>Bold Italic</option></select></label><label>Version<input id="infoVersion" value="1.0.0"></label><label>Author<input id="infoAuthor"></label><label>Copyright<input id="infoCopyright"></label><label>Units Per Em<input id="upm" type="number" value="1000"></label><label>Ascender<input id="ascender" type="number" value="800"></label><label>Descender<input id="descender" type="number" value="-200"></label></div></div>
<div id="panel-export" class="panel"><div class="panelbar"><strong>Export</strong></div><div class="export-cards"><button onclick="location.href='export.html'">TTF / WOFF / WOFF2</button><button onclick="exportJSON()">JSON Project</button><button onclick="exportSVG()">SVG Glyph</button><button onclick="exportCSS()">CSS</button></div></div>
</main></div><script src="js/app.js"></script><script src="js/editor.js"></script></body></html>
